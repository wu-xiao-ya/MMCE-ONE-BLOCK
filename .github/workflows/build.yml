name: Build and validate

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      mmcege_repo:
        description: MMCEGE repository slug
        required: false
        default: wu-xiao-ya/Modular-Machinery-Community-Edition-Gui-Edit
      mmcege_ref:
        description: Exact MMCEGE commit SHA
        required: false
        default: 787ee49ab641079b7b0aa3abee789c393d5f120c
      mmce_repo:
        description: Modular Machinery CE repository slug used only for the Gradle wrapper/reference checkout
        required: false
        default: NovaEngineering-Source/ModularMachinery-Community-Edition
      mmce_ref:
        description: Modular Machinery CE ref used only for the Gradle wrapper/reference checkout
        required: false
        default: master
      run_smoke:
        description: Run the server smoke fixture after build
        required: false
        default: 'true'
      run_client_smoke:
        description: Run the client launch smoke fixture after build
        required: false
        default: 'true'

jobs:
  build-and-validate:
    name: Build MMCEGE first, then validate one block
    runs-on: ubuntu-latest
    env:
      MODULAR_MACHINERY_CURSE: curse.maven:modular-machinery-community-edition-817377:7372953
      MMCEGE_MAVEN: com.fushu.mmce:MMCEGE:1.3.0
      RUN_SMOKE: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.run_smoke == 'true' }}
      RUN_CLIENT_SMOKE: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.run_client_smoke == 'true' }}

    steps:
      - name: Verify requested MMCEGE ref
        id: mmcege_ref
        shell: bash
        env:
          EXPECTED_MMCEGE_SHA: 787ee49ab641079b7b0aa3abee789c393d5f120c
        run: |
          repo="${{ github.event.inputs.mmcege_repo || 'wu-xiao-ya/Modular-Machinery-Community-Edition-Gui-Edit' }}"
          requested="${{ github.event.inputs.mmcege_ref || '787ee49ab641079b7b0aa3abee789c393d5f120c' }}"
          if [ "$requested" != "$EXPECTED_MMCEGE_SHA" ]; then
            echo "MMCEGE must stay pinned to $EXPECTED_MMCEGE_SHA; got '$requested'." >&2
            exit 1
          fi
          remote="$(git ls-remote "https://github.com/${repo}.git")"
          if ! printf '%s\n' "$remote" | awk -v wanted="$requested" \
            '$1 == wanted { found=1 } END { exit found ? 0 : 1 }'; then
            echo "Requested MMCEGE SHA '$requested' was not found in $repo; refusing to fall back." >&2
            exit 1
          fi
          echo "ref=${requested}" >> "$GITHUB_OUTPUT"

      - name: Verify MMCE wrapper branch
        id: mmce_ref
        shell: bash
        run: |
          repo="${{ github.event.inputs.mmce_repo || 'NovaEngineering-Source/ModularMachinery-Community-Edition' }}"
          preferred="${{ github.event.inputs.mmce_ref || 'master' }}"
          if git ls-remote --heads "https://github.com/${repo}.git" "${preferred}" | grep -q "${preferred}"; then
            echo "ref=${preferred}" >> "$GITHUB_OUTPUT"
          else
            echo "Requested MMCE wrapper/reference ref '$preferred' was not found in $repo." >&2
            exit 1
          fi

      - name: Checkout MMCEGE
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.mmcege_repo || 'wu-xiao-ya/Modular-Machinery-Community-Edition-Gui-Edit' }}
          ref: ${{ steps.mmcege_ref.outputs.ref }}
          path: mmcege
          fetch-depth: 1

      - name: Checkout MMCE wrapper/reference
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.mmce_repo || 'NovaEngineering-Source/ModularMachinery-Community-Edition' }}
          ref: ${{ steps.mmce_ref.outputs.ref }}
          path: mmce-src
          fetch-depth: 1

      - name: Record dependency revisions
        shell: bash
        run: |
          {
            echo "### Dependency revisions"
            echo
            echo "| Component | Ref | SHA |"
            echo "| --- | --- | --- |"
            echo "| MMCEGE | \`${{ steps.mmcege_ref.outputs.ref }}\` | \`$(git -C mmcege rev-parse HEAD)\` |"
            echo "| MMCE wrapper/reference | \`${{ steps.mmce_ref.outputs.ref }}\` | \`$(git -C mmce-src rev-parse HEAD)\` |"
            echo "| MMCE One Block | \`${{ github.ref_name }}\` | \`${{ github.sha }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build and publish MMCEGE to the local Maven cache
        shell: bash
        working-directory: mmce-src
        run: |
          chmod +x gradlew
          ./gradlew -p ../mmcege --no-daemon --no-parallel --console=plain build publishToMavenLocal --stacktrace

      - name: Checkout MMCE One Block
        uses: actions/checkout@v4
        with:
          path: mmce-one-block
          fetch-depth: 1

      - name: Validate example JSON
        shell: bash
        working-directory: mmce-one-block
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("examples/one-block-machine.json").read_text(encoding="utf-8"))
          assert data["id"] == "starter_controller"
          assert data["machine"] == "starter_machine"
          assert data["guiStyle"] == "mmceoneblock:starter_controller"
          assert data["block"]["model"] == "mmceoneblock:single_block_machine_controller"
          assert data["block"]["texture"] == "mmceoneblock:blocks/starter_controller"
          assert data["enabled"] is True
          assert len(data["components"]) >= 5
          assert {component["type"] for component in data["components"]} >= {
              "item_input", "fluid_input", "gas_input", "energy_input", "item_output"
          }
          PY

      - name: Validate client cfg sample
        shell: bash
        working-directory: mmce-one-block
        run: |
          grep -q 'B:enabled=true' examples/client.cfg.sample
          grep -q 'S:smartInterfaceEditorVirtualKey=energy_target,fluid_target' examples/client.cfg.sample
          grep -q 'S:specialThreadBackgroundColor=FF7DD3FC' examples/client.cfg.sample

      - name: Validate smoke fixtures and model resources
        shell: bash
        working-directory: mmce-one-block
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path(".")
          machine_dir = root / "examples/smoke/config/mmce-one-block/machines"
          optional_advanced = root / "examples/optional/advanced_mana_pool_controller.json"
          machines = sorted(machine_dir.glob("*.json"))
          assert [file.name for file in machines] == [
              "starter_controller.json",
              "starter_factory_controller.json",
          ]
          assert len(machines) == 2
          for file in machines:
              json.loads(file.read_text(encoding="utf-8-sig"))

          advanced = json.loads(optional_advanced.read_text(encoding="utf-8-sig"))

          starter = json.loads(
              (machine_dir / "starter_controller.json").read_text(encoding="utf-8-sig")
          )
          assert starter["id"] == "starter_controller"
          assert starter["guiStyle"] == "mmceoneblock:starter_controller"

          factory_controller = json.loads(
              (machine_dir / "starter_factory_controller.json").read_text(encoding="utf-8-sig")
          )
          assert factory_controller["id"] == "factory_controller"
          assert factory_controller["controllerType"] == "factory"
          assert factory_controller["factoryGuiStyle"] == "mmceoneblock:factory_controller"

          starter_style = json.loads(
              (root / "examples/smoke/config/mmceguiext/styles/starter_controller.json")
              .read_text(encoding="utf-8-sig")
          )
          starter_machine = starter_style["mmce_gui_ext"]["machineController"]
          assert starter_machine["smartInterfaceEditors"][0]["virtualKey"] == "oneblock_smoke_target"
          assert starter_machine["dynamicVisuals"][0]["source"]["key"] == "oneblock.component.energy_in.amount"
          assert starter_machine["dynamicVisuals"][0]["source"]["maxSource"]["key"] == "oneblock.component.energy_in.capacity"

          assert advanced["id"] == "advanced_mana_pool_controller"
          assert advanced["machine"] == "starter_machine"
          assert advanced["block"]["model"].endswith("_empty")
          assert advanced["block"]["itemModel"].endswith("_full")
          assert advanced["components"][0]["type"] == "fluid_input"

          block = advanced["block"]
          assert [level["minFillRatio"] for level in block["textureLevels"]] == [
              0.25, 0.5, 0.75, 1.0
          ]
          assert all(level["content"] == "fluid" for level in block["textureLevels"])

          model_ids = {
              block["model"],
              block["itemModel"],
              *(state["model"] for state in block["states"].values()),
              *(level["model"] for level in block["textureLevels"]),
          }
          for model_id in model_ids:
              namespace, path = model_id.split(":", 1)
              model = root / "src/main/resources/assets" / namespace / "models/block" / f"{path}.json"
              assert model.is_file(), model

          factory_style = json.loads(
              (root / "examples/smoke/config/mmceguiext/styles/factory_controller.json")
              .read_text(encoding="utf-8-sig")
          )
          factory = factory_style["mmce_gui_ext"]["factoryController"]
          assert [group["id"] for group in factory["slotGroups"]] == [
              "input", "output", "blueprint"
          ]
          assert factory["buttons"][0]["targetSubGui"] == "factory_threads"

          subgui = json.loads(
              (root / "examples/smoke/config/mmceguiext/subgui/factory_threads.json")
              .read_text(encoding="utf-8-sig")
          )
          assert subgui["controller"] == "factory"
          assert subgui["id"] == "factory_threads"
          assert subgui["threadQueueMode"] == "visible"

          for texture_id in block["textures"].values():
              namespace, path = texture_id.split(":", 1)
              assert namespace == "mmceoneblock"
              texture = root / "src/main/resources/assets" / namespace / "textures" / f"{path}.png"
              assert texture.is_file(), texture
          PY

      - name: Check test sources are real JUnit tests
        shell: bash
        working-directory: mmce-one-block
        run: |
          grep -q '@Test' src/test/java/com/fushu/mmceoneblock/config/OneBlockMachineConfigParserTest.java
          grep -q '@Test' src/test/java/com/fushu/mmceoneblock/api/MMCEGEApiBridgeTest.java
          grep -q '@Test' src/test/java/com/fushu/mmceoneblock/examples/OneBlockExampleFixtureTest.java
          grep -q '@Test' src/test/java/com/fushu/mmceoneblock/common/config/MachineConfigLoaderDirectoryTest.java
          grep -q '@Test' src/test/java/com/fushu/mmceoneblock/common/container/ContainerSingleBlockControllerTest.java
          grep -q '@Test' src/test/java/com/fushu/mmceoneblock/common/container/ContainerSingleBlockFactoryControllerTest.java
          grep -q '@Test' src/test/java/com/fushu/mmceoneblock/common/registry/MachineRegistryValidationTest.java
          grep -q '@Test' src/test/java/com/fushu/mmceoneblock/common/tile/TileSingleBlockMachineControllerPayloadTest.java
          grep -q '@Test' src/test/java/com/fushu/mmceoneblock/common/tile/TileSingleBlockMachineControllerRuntimeComponentTest.java
          grep -q '@Test' src/test/java/com/fushu/mmceoneblock/common/tile/TileSingleBlockFactoryControllerRuntimeTest.java
          grep -q '@Test' src/test/java/com/fushu/mmceoneblock/tile/TileSingleBlockMachineControllerTest.java

      - name: Build MMCE One Block
        shell: bash
        working-directory: mmce-src
        run: |
          chmod +x gradlew
          ./gradlew -p ../mmce-one-block --no-daemon --no-parallel --console=plain -PmodularMachineryCurse="$MODULAR_MACHINERY_CURSE" -PmmceGuiExtMaven="$MMCEGE_MAVEN" build --stacktrace

      - name: Prepare smoke fixture
        if: ${{ env.RUN_SMOKE == 'true' || env.RUN_CLIENT_SMOKE == 'true' }}
        shell: bash
        working-directory: mmce-one-block
        run: |
          mkdir -p run/config
          cp -R examples/smoke/config/. run/config/
          echo "eula=true" > run/eula.txt

      - name: Run server smoke fixture
        if: ${{ env.RUN_SMOKE == 'true' }}
        shell: bash
        working-directory: mmce-src
        run: |
          set +e
          timeout 240s ./gradlew -p ../mmce-one-block --no-daemon --no-parallel --console=plain -PmmceOneBlockDevValidation=true runServer --stacktrace
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            exit "$status"
          fi
          log="../mmce-one-block/run/logs/latest.log"
          machine_count="$(find ../mmce-one-block/examples/smoke/config/mmce-one-block/machines -maxdepth 1 -type f -name '*.json' | wc -l | tr -d ' ')"
          grep -q "Loaded ${machine_count} one-block machine definition(s)" "$log"
          grep -q "Validated ${machine_count} one-block machine definition(s) against loaded MMCE machines (0 missing, 0 mismatched)" "$log"
          grep -q "Machines: \\[1 loaded, 0 failed\\]" "$log"
          grep -q "modularmachinery:starter_machine (Recipes): \\[1 loaded, 0 failed\\]" "$log"
          grep -q "Forge Mod Loader has successfully loaded" "$log"
          grep -q "Done (" "$log"
          grep -q "\\[MMCE One Block DevValidation\\] PASS id=starter_controller" "$log"
          grep -q "\\[MMCE One Block DevValidation\\] FACTORY_PASS id=factory_controller" "$log"
          grep -q "formed=true" "$log"
          grep -q "redstonePaused=true" "$log"
          grep -q "outputBlocked=true" "$log"
          grep -q "outputRecovered=true" "$log"
          grep -q "recipeFinished=true" "$log"
          grep -q "nbtPayload=true" "$log"
          grep -q "chunkReloaded=true" "$log"
          grep -q "inventoryPersisted=true" "$log"
          grep -q "energyPersisted=true" "$log"
          grep -q "comparatorAfterFormed=1" "$log"
          grep -q "destroy drop verified id=starter_controller" "$log"
          grep -q "blockDropped=true" "$log"
          grep -q "tileCleared=true" "$log"
          grep -q "factoryFormed=true" "$log"
          grep -q "factoryComponents=true" "$log"
          grep -q "factoryNbtPayload=true" "$log"
          if grep -q "Skipping one-block machine" "$log"; then
            exit 1
          fi
          if grep -q "\\[MMCE One Block DevValidation\\] FAIL" "$log"; then
            exit 1
          fi
          if grep -q "\\[MMCE One Block DevValidation\\] FACTORY_FAIL" "$log"; then
            exit 1
          fi
          cp "$log" "../mmce-one-block/run/logs/server-smoke-latest.log"

      - name: Run client launch smoke fixture
        if: ${{ env.RUN_CLIENT_SMOKE == 'true' }}
        shell: bash
        working-directory: mmce-src
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          _JAVA_OPTIONS: -Dorg.lwjgl.opengl.Display.allowSoftwareOpenGL=true
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1 || ! command -v xrandr >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb x11-xserver-utils
          fi
          mkdir -p ../mmce-one-block/run/logs
          rm -f ../mmce-one-block/run/logs/latest.log
          set +e
          setsid xvfb-run -a -s "-screen 0 1280x1024x24 +extension RANDR +extension GLX +render -noreset" bash -lc 'xrandr -q || true; exec ./gradlew -p ../mmce-one-block --no-daemon --no-parallel --console=plain -PmmceOneBlockClientGuiValidation=true runClient --stacktrace' &
          client_pid=$!
          loaded=0
          machine_count="$(find ../mmce-one-block/examples/smoke/config/mmce-one-block/machines -maxdepth 1 -type f -name '*.json' | wc -l | tr -d ' ')"
          deadline=$((SECONDS + 300))
          log="../mmce-one-block/run/logs/latest.log"
          while [ "$SECONDS" -lt "$deadline" ]; do
            if ! kill -0 "$client_pid" >/dev/null 2>&1; then
              break
            fi
            if [ -f "$log" ] && grep -q "\\[MMCE One Block ClientGuiValidation\\] FAIL" "$log"; then
              break
            fi
            if [ -f "$log" ] \
              && grep -q "LWJGL Version" "$log" \
              && grep -q "MinecraftForge v" "$log" \
              && grep -q "Loaded ${machine_count} one-block machine definition(s)" "$log" \
              && grep -q "Validated ${machine_count} one-block machine definition(s) against loaded MMCE machines (0 missing, 0 mismatched)" "$log" \
              && grep -q "Forge Mod Loader has successfully loaded" "$log" \
              && grep -q "mmceoneblock" "$log" \
              && grep -q "mmceguiext" "$log" \
              && grep -q "\\[MMCE One Block ClientGuiValidation\\] PASS id=starter_controller" "$log" \
              && grep -q "\\[MMCE One Block ClientGuiValidation\\] PASS id=factory_controller" "$log" \
              && grep -q "screen=com.fushu.mmceguiext.client.gui.GuiMachineControllerResizable" "$log" \
              && grep -q "screen=com.fushu.mmceguiext.client.gui.GuiFactoryControllerResizable" "$log" \
              && grep -q "container=com.fushu.mmceoneblock.common.container.ContainerSingleBlockController" "$log" \
              && grep -q "container=com.fushu.mmceoneblock.common.container.ContainerSingleBlockFactoryController" "$log" \
              && grep -q "verified virtual Smart Interface write key=oneblock_smoke_target value=42.0" "$log" \
              && grep -q "screenshot saved under .* for id=starter_controller" "$log" \
              && grep -q "screenshot saved under .* for id=factory_controller" "$log" \
              && grep -q "styleRuntime=true" "$log" \
              && grep -q "displayed=true" "$log"; then
              loaded=1
              break
            fi
            sleep 2
          done
          if kill -0 "$client_pid" >/dev/null 2>&1; then
            kill -- "-$client_pid" >/dev/null 2>&1 || kill "$client_pid" >/dev/null 2>&1 || true
          fi
          wait "$client_pid" >/dev/null 2>&1
          status=$?
          set -e
          if [ "$loaded" -ne 1 ]; then
            if [ -f "$log" ]; then
              tail -n 200 "$log"
            fi
            if [ "$status" -eq 0 ]; then
              exit 1
            fi
            exit "$status"
          fi
          if grep -q "Skipping one-block machine" "$log"; then
            exit 1
          fi
          if grep -q "Caught exception from MMCE One Block" "$log"; then
            exit 1
          fi
          if grep -q "\\[MMCE One Block ClientGuiValidation\\] FAIL" "$log"; then
            exit 1
          fi
          if grep -q "Exception loading model for variant modularmachinery:starter_machine_controller" "$log"; then
            exit 1
          fi
          if grep -q "Exception loading model for variant modularmachinery:factory_controller" "$log"; then
            exit 1
          fi
          if grep -q "FileNotFoundException: modularmachinery:blockstates/starter_machine_controller.json" "$log"; then
            exit 1
          fi
          if grep -q "FileNotFoundException: modularmachinery:blockstates/factory_controller.json" "$log"; then
            exit 1
          fi
          if grep -q "A fatal error has occurred" "$log"; then
            exit 1
          fi
          if grep -q "Crash report saved to" "$log"; then
            exit 1
          fi
          cp "$log" "../mmce-one-block/run/logs/client-smoke-latest.log"

      - name: Upload smoke logs
        if: ${{ always() && (env.RUN_SMOKE == 'true' || env.RUN_CLIENT_SMOKE == 'true') }}
        uses: actions/upload-artifact@v4
        with:
          name: mmce-one-block-smoke-logs-${{ github.sha }}
          path: |
            mmce-one-block/run/logs
            mmce-one-block/run/crash-reports
            mmce-one-block/run/screenshots
          if-no-files-found: ignore

      - name: Upload MMCE One Block artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: mmce-one-block-${{ github.sha }}
          path: mmce-one-block/build/libs
